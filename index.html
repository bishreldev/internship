<!DOCTYPE html>
<!-- lang="mn": tells browsers and screen readers the page is in Mongolian -->
<html lang="mn">
<head>
  <!-- UTF-8 lets the browser show Cyrillic letters correctly -->
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a tiny desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дадлага хайх — Монгол оюутнуудад</title>
  <meta name="description" content="Монгол оюутнууд өргөдөл гаргаж болох дадлагыг олоход туслах сайт.">
  <!-- Loads the styles (colors, fonts, layout) from a separate file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- class="..." connects an element to its styles in css/style.css -->
  <main class="hero">
    <p class="badge">Удахгүй нээгдэнэ · <span lang="en">Coming soon</span></p>
    <h1>Сайн байна уу!</h1>
    <p class="lead">Энэ сайт Монгол оюутнуудад өргөдөл гаргаж болох дадлагыг олоход тусална.</p>

    <!-- lang="en": this paragraph is English, so screen readers switch pronunciation -->
    <p class="lead-en" lang="en">Hello! This site will help students in Mongolia find internships they can actually apply to.</p>
  </main>
</body>
</html>
